[project]
name = "ghost-worker"
version = "0.1.0"
description = "Ghost model-facing worker: claim extraction (graph maintenance) and draft agent (account action)"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.8",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "litellm>=1.67",
    "httpx>=0.27",
    "pydantic-settings>=2.4",
]

[project.optional-dependencies]
test = [
    "pytest>=8",
    "pytest-cov>=5",
    "jsonschema>=4.23",
    "referencing>=0.35",
    "rfc3339-validator>=0.1.4",
    "openapi-spec-validator>=0.7",
    "pyyaml>=6",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ghost_worker*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "-q"

[tool.coverage.run]
branch = true
source = ["ghost_worker"]

[tool.coverage.report]
show_missing = true
