# Slack app manifest for Cliff, the Slack face of gtm_ai (HAR-138 / HAR-137 / HAR-129).
# Single declarative source: the app is created and updated from this file via the
# apps.manifest.* API (scripts/slack/bootstrap.py). Socket Mode is enabled, so no public
# request URL is needed. See docs/slack-setup.md.
#
# Ask Cliff (owner-approved HAR-129 contract change, 2026-10-06) adds the DM and @mention scopes and the
# two events below. Adding scopes needs the owner to click Reinstall after the manifest is applied.
display_information:
  name: Cliff
  description: GTM Intelligence Agent
  background_color: "#1f2937"
features:
  app_home:
    home_tab_enabled: false
    # Ask Cliff: people message Cliff directly, so the Messages tab is on and not read-only.
    messages_tab_enabled: true
    messages_tab_read_only_enabled: false
  bot_user:
    display_name: Cliff
    always_online: false
oauth_config:
  scopes:
    bot:
      # Runtime (HAR-137): chat.postMessage / chat.update / chat.postEphemeral. views.open needs no scope.
      - chat:write
      # Bootstrap only (HAR-138 step 9): resolve #gtm-ai-demo by name, create it if missing,
      # and join it so the bot can post.
      - channels:read
      - channels:manage
      - channels:join
      # Runtime: the listener finds a message it posted earlier (conversations.history) so a retry
      # adopts it instead of posting twice.
      - channels:history
      # Ask Cliff: receive an @mention in a channel and reply in its thread (app_mention).
      - app_mentions:read
      # Ask Cliff: receive and answer direct messages (message.im).
      - im:history
      - im:read
      - im:write
settings:
  event_subscriptions:
    bot_events:
      - app_mention
      - message.im
  interactivity:
    is_enabled: true
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
